# Disabilita la stampa del banner spring nei log
spring.main.banner-mode=off

# ------------ JSON SERIALIZATION & PRESENTATION-------------------

# Pattern date
spring.mvc.date-format=yyyy-MM-dd
spring.mvc.datetime-format=yyyy-MM-dd'T'HH:mm:ssZZZ
spring.mvc.throw-exception-if-no-handler-found=true

spring.jackson.default-property-inclusion=non_null

server.error.whitelabel.enabled=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=Europe/Rome
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE

# ------------ LOGGING (govpay-common) ------------------
# Transaction id e correlation id in ogni riga di log (BP-LOG-3), popolati dal
# TransactionIdFilter di govpay-common: il transaction id e' generato a ogni
# richiesta e non e' mai accettato dall'esterno, il correlation id e' letto da
# X-Correlation-ID / X-Request-ID (o generato) ed e' propagato alle chiamate
# downstream. Entrambi sono restituiti al client negli header di risposta.
# Cosi' un evento scritto sul giornale e' correlabile ai log del componente
# che lo ha inviato.
logging.pattern.level=%5p [%X{transactionId:-},%X{correlationId:-}]

# I livelli di log dinamici su database (BP-LOG-1) non sono attivi qui: la loro
# sorgente e' la tabella configurazione di GovPay, su cui gde-api non insiste.
# Resta disponibile /actuator/loggers, vedi la nota sull'esposizione piu' sotto.
govpay.logging.livelli-dinamici.enabled=false

# -------------- OBSERVABILITY (Prometheus) ----------------

# Via web sono esposti il solo endpoint di scrape e health (per le probe
# di container/orchestratori). Di default rispondono sulla porta applicativa;
# impostando la variabile d'ambiente MANAGEMENT_SERVER_PORT si spostano su
# una porta dedicata.
# 'loggers' NON e' incluso di default: qui actuator risponde sulla porta
# applicativa e il componente non ha Spring Security, quindi sarebbe un
# endpoint di scrittura non autenticato (BP-SEC-2). Va abilitato solo insieme
# a una porta management dedicata e segregata in rete, per esempio:
#   MANAGEMENT_SERVER_PORT=9090 MANAGEMENT_ENDPOINTS=health,prometheus,loggers
management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS:health,prometheus}
# Istogrammi (bucket) sulle latenze server: permettono a Prometheus di
# aggregare percentili tra piu' istanze.
# NB: aumenta serie e memoria. Da tenere in considerazione nelle configurazioni in produzione
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Bucket esplicito vicino alla soglia SLA pagoPA (2s): permette di calcolare
# la frazione di richieste sotto soglia per confronto diretto, senza
# affidarsi all'interpolazione di histogram_quantile sui bucket di default.
management.metrics.distribution.slo.http.server.requests=100ms,500ms,1s,2s,5s
# Tag comune per distinguere il servizio quando Prometheus raccoglie piu' app.
management.metrics.tags.application=govpay-gde-api

# -------------- BUSINESS LOGIC PROPERTIES  ----------------

gde.time-zone=Europe/Rome

